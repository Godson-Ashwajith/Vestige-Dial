!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestige & Dial | Online Store</title>
    <style>
        :root { --primary: #2874f0; --text: #212121; }
        body { font-family: Roboto, Arial, sans-serif; margin: 0; background-color: #f1f3f6; color: var(--text); }
        header { background: var(--primary); color: white; padding: 12px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .search-bar { background: white; margin: 10px; padding: 8px; border-radius: 4px; color: #878787; font-size: 14px; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        .product-card { background: white; padding: 10px; border-radius: 2px; display: flex; flex-direction: column; align-items: center; }
        .product-img { width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
        .price { font-weight: bold; color: #388e3c; margin: 5px 0; }
        .buy-btn { background: #ff9f00; color: white; border: none; padding: 8px; width: 100%; border-radius: 2px; font-weight: bold; cursor: pointer; }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #878787; }
    </style>
</head>
<body>

<header>
    <strong>Vestige & Dial</strong>
    <div class="search-bar">Search for Products, Brands and More</div>
</header>

<div class="product-grid">
    <div class="product-card">
        <div class="product-img">Product Image</div>
        <p style="font-size: 14px; margin: 8px 0 0 0;">Premium Watch</p>
        <div class="price">₹1,499</div>
        <button class="buy-btn">BUY NOW</button>
    </div>
    <div class="product-card">
        <div class="product-img">Product Image</div>
        <p style="font-size: 14px; margin: 8px 0 0 0;">Smart Gadget</p>
        <div class="price">₹2,999</div>
        <button class="buy-btn">BUY NOW</button>
    </div>
</div>

<footer>
    <p>Based in Palakkad, Kerala</p>
    <p>24/7 Service Available</p>
</footer>

</body>
</html>
